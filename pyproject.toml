[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activemap"
version = "0.1.0"
description = "Edit-conditioned evidence acquisition for budgeted vector map updating"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Research-only until third-party license audit is complete"}
authors = [{name = "ActiveMap Research Team"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<23",
  "geopandas>=0.14,<2",
  "shapely>=2.0,<3",
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "affine>=2.4,<4",
  "scipy>=1.12,<2",
  "Pillow>=10,<13",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jsonschema>=4.21,<5",
  "tqdm>=4.66,<5",
  "h5py>=3.10,<4",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]
graph-eval = [
  "scikit-image>=0.22,<1",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
activemap = "activemap.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["activemap"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

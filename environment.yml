name: activemap
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=24
  - gdal>=3.6
  - geopandas>=0.14
  - rasterio>=1.3
  - pyarrow>=15
  - pip:
      - -r requirements.txt
      - -r requirements-dev.txt

# This environment deliberately omits PyTorch. Install the CUDA-matched torch
# and torchvision wheels for the target GPU before training, then install the
# package with: python -m pip install -e . --no-deps

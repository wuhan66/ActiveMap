name: activemap-sam-road
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - pytorch-cuda=12.1
  - numpy<2
  - scipy>=1.12,<2
  - pillow>=10,<13
  - rasterio>=1.3,<2
  - pydantic>=2.6,<3
  - pyyaml>=6,<7
  - tqdm>=4.66,<5
  - pip
  - pip:
      - setuptools==79.0.1
      - lightning==2.2.5
      - pytorch-lightning==2.2.5
      - torchmetrics==1.3.2
      - wandb==0.16.6
      - addict==2.4.0
      - matplotlib>=3.8,<4

# After creation, install ActiveMap without changing this isolated solver:
#   conda run -n activemap-sam-road pip install --no-deps -e /home/wh/projects/activemap-v1-joint-debug

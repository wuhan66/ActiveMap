schema_version: activemap-external-baselines-v1
storage_root_env: ACTIVEMAP_STORAGE_ROOT

protocol:
  splits_from_activemap_manifests_only: true
  validation_selects_checkpoint_and_thresholds: true
  frozen_test_once: true
  common_preprocessing_required: true
  immutable_source_commit_required_before_run: true
  license_review_required_before_distribution: true
  output_contract: activemap-external-baseline-result-v1

suites:

experiments:
  - id: sn7_external_update_baselines
    family: updater
    dataset: sn7
    role: diagnostic_perception_robustness
    trainable: true
    seeds: [20260716, 20260719, 20260722]
    methods: [concat_unet]
    config: configs/experiments/external_baselines.yaml
    required_metrics: [macro_f1, update_f1, false_edit_rate, raster_iou, polygon_iou]
    primary_metrics: [macro_f1, false_edit_rate, polygon_iou]
    requires: [sn7_audit, manual_qc_approval]
    test_policy: frozen_once
  - id: sn7_changemamba_baseline
    family: updater
    dataset: sn7
    role: diagnostic_perception_robustness
    trainable: true
    seeds: [20260725, 20260726, 20260727]
    seed_semantics: upstream_model_training
    methods: [change_mamba]
    config: configs/experiments/external_baselines.yaml
    required_metrics: [macro_f1, update_f1, false_edit_rate, missed_edit_rate, raster_iou]
    primary_metrics: [macro_f1, false_edit_rate, raster_iou]
    requires: [sn7_audit, manual_qc_approval]
    test_policy: frozen_once
  - id: sn7_changemamba_commit_policy
    family: updater
    dataset: sn7
    role: component_replaceability_ablation
    trainable: true
    seeds: [20260725, 20260726, 20260727]
    seed_semantics: upstream_model_training
    methods:
      - always_commit
      - safe_commit
      - changemamba_to_changemamba_source_oof
      - ban_to_ban_source_oof
      - changemamba_to_ban_source_oof
      - changemamba_to_ban_all_target_train

schema_version: activemap-paper-registry-v1
paper_target: CVPR/ICLR
working_title: "ActiveMap: Active Evidence Acquisition for Safe Editable Map Updating"
claim_evidence_protocol: configs/experiments/claim_evidence_protocol_v2.yaml
interpretation: >-
  This v1 file is the execution/artifact registry. Its required paired comparisons
  are preregistered hypotheses, not supported manuscript claims. Claim status and
  the final method are governed by claim_evidence_protocol_v2.yaml.
title_if_agent_passes: "ActiveMap: Active Evidence Acquisition for Safe Editable Map Updating"
title_fallback: "ActiveMap: Active Evidence Acquisition for Safe Editable Map Updating"

current_outcome_overrides:
  sn7_tools_vs_no_tools: failed_promotion
  sn7_recurrent_vs_identity_belief: failed_promotion
  sn7_final_candidate: active_residual_no_tools_plus_safe_commit
  sn7_final_candidate_status: direct_three_seed_evaluation_pending

protocol:
  train_seeds: [20260716, 20260719, 20260722]
  test_policy: frozen_once
  test_requires_qc_approval: true
  checkpoint_source: validation_only
  threshold_source: validation_only
  bootstrap_unit: task_or_aoi
  bootstrap_replicates: 1000
  bootstrap_seed: 20260715
  confidence_level: 0.95
  sn7_safe_commit_frozen_matrix:
    seeds: [20260725, 20260726, 20260727]
    folds: 5
    l2: 0.01
    threshold_grid_points: 101
    threshold_selection_uses_test: false
    bootstrap_replicates: 5000
    bootstrap_seed: 20260727
    variants:
      - changemamba_to_changemamba_source_oof
      - ban_to_ban_source_oof
      - changemamba_to_ban_source_oof
      - changemamba_to_ban_all_target_train
      - ban_to_changemamba_source_oof
      - ban_to_changemamba_all_target_train
  primary_budget:
    sn7: 4.0
    muno21: 3.0
  muno21_budgets: [1.5, 3.0, 4.5]
  safety_gates:
    max_false_edit_rate: 0.05
    min_schema_valid_rate: 0.99
    min_executable_valid_rate: 0.99
    max_fallback_rate: 0.01
    min_grounded_tool_recall: 0.05
    require_nonnegative_quality_cost_auc_delta: true
    require_writeback_replay_consistency: true
  paired_comparison_margins:
    min_primary_utility_delta: 0.0
    min_quality_cost_auc_delta: 0.0
    max_false_edit_rate_delta: 0.01
    max_mean_cost_delta_for_matched_cost: 0.0

required_paired_comparisons:
  - id: sn7_onpolicy_round1_vs_contextual_rl
    claim: "Recurrently executed on-policy preference optimization improves over its matched contextual-RL reference."
    baseline_experiment: sn7_active_catalog_contextual_rl_seed1
    candidate_experiment: sn7_active_catalog_onpolicy_round1
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated]
  - id: sn7_contextual_rl_vs_sft
    claim: "Validation-gated contextual policy optimization improves recurrent executable map updating over SFT."
    baseline_experiment: sn7_active_catalog_closed_loop_qwen
    candidate_experiment: sn7_active_catalog_contextual_rl_seed1
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated]
  - id: sn7_recurrent_vs_react
    claim: "Belief-conditioned recurrent control improves over direct ReAct under matched tools, budget, backbone, and writeback."
    baseline_experiment: sn7_modern_controller_protocols
    baseline_variant: react
    candidate_experiment: sn7_modern_controller_protocols
    candidate_variant: recurrent_sft
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: sn7_recurrent_vs_plan_execute
    claim: "Closed-loop belief-conditioned replanning improves over an initially frozen evidence plan."
    baseline_experiment: sn7_modern_controller_protocols
    baseline_variant: plan_execute
    candidate_experiment: sn7_modern_controller_protocols
    candidate_variant: recurrent_sft
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: sn7_risk_gated_vs_unconditional_carry
    claim: "Outcome-free risk gating reduces chronological error propagation relative to unconditional persistent edits."
    baseline_experiment: sn7_chronological_map_maintenance
    baseline_variant: unconditional_carry
    candidate_experiment: sn7_chronological_map_maintenance
    candidate_variant: risk_gated_carry
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated]
  - id: sn7_selective_tool_writeback_vs_no_tool
    claim: "Selective grounded tools improve executable map quality beyond the no-tool Agent."
    baseline_experiment: sn7_active_catalog_selective_tool_writeback
    baseline_variant: no_tool
    candidate_experiment: sn7_active_catalog_selective_tool_writeback
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated]
  - id: sn7_selective_tool_writeback_vs_forced
    claim: "Selective grounded tools improve executable map quality beyond forced tool use."
    baseline_experiment: sn7_active_catalog_selective_tool_writeback
    baseline_variant: forced_tools
    candidate_experiment: sn7_active_catalog_selective_tool_writeback
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: sn7_selective_tools_vs_no_tools
    claim: "Selective grounded tool use improves over the no-tool recurrent Agent."
    baseline_experiment: sn7_active_catalog_closed_loop_qwen
    candidate_experiment: sn7_active_catalog_selective_tool_agent
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: sn7_selective_tools_vs_forced_tools
    claim: "Risk-aware sparse tool calling improves over forced tool invocation."
    baseline_experiment: sn7_active_catalog_forced_tool_agent
    candidate_experiment: sn7_active_catalog_selective_tool_agent
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: sn7_active_catalog_qwen_vs_uncertainty_gate
    claim: "Recurrent visual evidence acquisition improves over an uncertainty-gated policy."
    baseline_experiment: sn7_active_catalog_heuristic_suite
    baseline_variant: uncertainty_gate
    candidate_experiment: sn7_active_catalog_closed_loop_qwen
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: sn7_active_catalog_qwen_vs_always_stop
    claim: "Active acquisition improves executable map updates beyond the direct policy."
    baseline_experiment: sn7_active_catalog_heuristic_suite
    baseline_variant: always_stop
    candidate_experiment: sn7_active_catalog_closed_loop_qwen
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: sn7_active_catalog_writeback_vs_uncertainty_gate
    claim: "Agent-selected evidence improves committed editable-vector map quality."
    baseline_experiment: sn7_active_catalog_heuristic_suite
    baseline_variant: uncertainty_gate
    candidate_experiment: sn7_active_catalog_executable_writeback
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: edit_conditioning_vs_generic
    claim: "Edit-conditioned selection improves the quality-cost-safety frontier."
    baseline_experiment: generic_selector
    candidate_experiment: edit_conditioned_selector
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: agent_vs_edit_conditioned
    claim: "Structured Agent control improves over the strongest learned selector."
    baseline_experiment: edit_conditioned_selector
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: recurrent_agent_vs_no_tools
    claim: "Selective grounded tool use adds value beyond the no-tool Agent."
    baseline_experiment: agent_without_tools
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: sparse_agent_vs_forced_tools
    claim: "Learning when not to call tools dominates forced tool invocation."
    baseline_experiment: agent_forced_tools
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated, matched_cost]
  - id: recurrent_agent_vs_no_belief
    claim: "Recurrent tool-to-belief updates improve closed-loop decisions."
    baseline_experiment: agent_without_recurrent_belief
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: reliability_gated_vs_ungated_belief
    claim: "Evidence-conditioned reliability gating improves Tool-Belief safety without sacrificing update quality."
    baseline_experiment: sn7_active_catalog_forced_tool_belief
    candidate_experiment: sn7_active_catalog_reliability_gated_tool_belief
    test_policy: validation_only
    required_gates: [quality_cost_safety_non_dominated]
  - id: agent_vs_random
    claim: "The Agent dominates deterministic random acquisition."
    baseline_experiment: heuristic_policy_suite
    baseline_variant: random
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: agent_vs_cheapest
    claim: "The Agent dominates cheapest-first acquisition."
    baseline_experiment: heuristic_policy_suite
    baseline_variant: cheapest
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: agent_vs_quality_first
    claim: "The Agent dominates quality-first acquisition."
    baseline_experiment: heuristic_policy_suite
    baseline_variant: quality_first
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: agent_vs_uncertainty
    claim: "The Agent dominates uncertainty-first acquisition."
    baseline_experiment: heuristic_policy_suite
    baseline_variant: uncertainty
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: agent_vs_mapex
    claim: "The Agent dominates a MapEx-style information-gain policy."
    baseline_experiment: heuristic_policy_suite
    baseline_variant: mapex
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]
  - id: agent_vs_greedy_utility
    claim: "The Agent dominates a risk-aware greedy utility policy."
    baseline_experiment: heuristic_policy_suite
    baseline_variant: greedy_utility
    candidate_experiment: agent_tool_to_belief
    test_policy: frozen_once
    required_gates: [quality_cost_safety_non_dominated]


  smoke_validation_records: 2
  test_assets_read: false

promotion:
  retriever_positive_opportunity_recall_at_least: 0.90
  selector_macro_f1_above_always_stop: true
  realized_utility_positive: true
  utility_task_bootstrap_ci_above_zero: true
  false_call_rate_at_most: 0.10
  evaluate_by_ground_truth_edit: true
  evaluate_by_aoi: true

blocked_until_full_oracle_and_sft_smoke:
  - full_qwen_sft
  - tool_belief_joint_training
  - constrained_rl
  - frozen_test

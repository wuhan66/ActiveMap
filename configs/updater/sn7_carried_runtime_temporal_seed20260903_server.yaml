# Train/internal repair for true sequential carried-map inference. Each replay
# sample uses aligned RGB_(t-1) || RGB_t, the carried map, and the current target.
seed: 20260903

data:
  samples: /home/wh/ActiveMap/processed/sn7_v1/updater_carried_runtime_temporal_20260903_v2/updater_samples_canonical_replay_v2.jsonl
  input_size: 512
  dataset_balance_power: 1.0
  edit_sampling_weights:
    KEEP: 1.0
    ADD: 1.0
    DELETE: 1.5
    RESHAPE: 1.1

model:
  image_channels: 6
  temporal_pair_input: true
  prior_channels: 1
  base_channels: 32
  geometry_dim: 8
  edit_classes: 4
  dropout: 0.10
  use_prior: true
  hierarchical_edit: true
  prior_guided_roi: false
  segmentation_evidence: false
  vector_change_encoder: false
  temporal_change_head: true
  temporal_change_to_edit_head: true
  temporal_spatial_edit_head: false

training:
  device: auto
  max_epochs: 24
  min_epochs: 8
  batch_size: 12
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  resume: false
  init_checkpoint: /home/wh/ActiveMap/runs/updater/v5_temporal_explicit_change_trainval_r1_seed20260817/best_quality.pt
  init_scope: full
  quality_score_mode: temporal_change
  quality_delete_recall_weight: 0.25
  quality_false_edit_weight: 0.25
  quality_missed_edit_weight: 0.20
  checkpoint_every: 2
  augmentation:
    enabled: true
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotate90_probability: 0.5
    brightness: 0.08
    contrast: 0.10
    gaussian_noise: 0.01
  early_stopping:
    patience: 6
    min_delta: 0.0001
  scheduler:
    factor: 0.5
    patience: 3
    threshold: 0.0001
    min_lr: 0.000001

monitoring:
  tensorboard: true
  progress_bar: true
  visualize_every: 2
  visualization_samples: 8
  pause_poll_seconds: 10

loss:
  segmentation: 1.0
  segmentation_bce: 1.0
  segmentation_dice: 1.0
  segmentation_focal: 0.25
  focal_gamma: 2.0
  focal_alpha: 0.75
  edit: 0.5
  edit_class_weights: null
  edit_class_weight_power: 0.25
  edit_label_smoothing: 0.02
  presence: 1.0
  change: 0.5
  geometry: 0.5
  geometry_beta: 0.1
  false_edit: 0.75
  missed_edit: 0.50
  confidence: 0.2
  temporal_change: 1.5
  temporal_change_bce: 0.5
  temporal_change_dice: 1.0
  temporal_change_focal: 1.0
  temporal_change_focal_alpha: 0.95

output_dir: /home/wh/ActiveMap/runs/updater/sn7_carried_runtime_temporal_seed20260903
archive_dir: /home/wh/projects/activemap-v1/outputs/updater/sn7_carried_runtime_temporal_seed20260903

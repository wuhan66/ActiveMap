seed: 20260710

data:
  samples: ../../data/processed/smoke_updater/updater_samples.jsonl

model:
  image_channels: 3
  prior_channels: 1
  base_channels: 32
  geometry_dim: 8
  edit_classes: 4
  dropout: 0.10
  use_prior: true

training:
  device: auto
  max_epochs: 80
  min_epochs: 15
  batch_size: 16
  num_workers: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  resume: false
  checkpoint_every: 5
  augmentation:
    enabled: true
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotate90_probability: 0.5
    brightness: 0.08
    contrast: 0.10
    gaussian_noise: 0.01
  early_stopping:
    monitor: val_loss
    patience: 12
    min_delta: 0.0001
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 3
    threshold: 0.0001
    cooldown: 0
    min_lr: 0.000001

monitoring:
  tensorboard: true
  progress_bar: true
  visualize_every: 1
  visualization_samples: 6
  pause_poll_seconds: 10

loss:
  segmentation: 1.0
  segmentation_bce: 1.0
  segmentation_dice: 1.0
  segmentation_focal: 0.25
  focal_gamma: 2.0
  focal_alpha: 0.75
  edit: 1.0
  edit_class_weights: auto
  edit_class_weight_power: 0.5
  edit_label_smoothing: 0.05
  geometry: 0.5
  geometry_beta: 0.1
  false_edit: 0.75
  missed_edit: 0.25
  confidence: 0.2

output_dir: ../../outputs/updater/base

seed: 20260816

data:
  samples: /home/wh/ActiveMap/processed/sn7_v1/updater_v5_temporal_pair_trainval_r1/updater_samples.jsonl
  edit_sampling_weights:
    KEEP: 1.0
    ADD: 1.0
    DELETE: 1.5
    RESHAPE: 1.1

model:
  # Fixed modality contract: RGB_(t-1) || RGB_t, followed internally by prior mask.
  image_channels: 6
  temporal_pair_input: true
  prior_channels: 1
  base_channels: 32
  geometry_dim: 8
  edit_classes: 4
  dropout: 0.10
  use_prior: true
  hierarchical_edit: true
  prior_guided_roi: false
  segmentation_evidence: false
  vector_change_encoder: false

training:
  device: auto
  max_epochs: 80
  min_epochs: 20
  batch_size: 32
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  resume: true
  quality_delete_recall_weight: 0.25
  quality_false_edit_weight: 0.25
  quality_missed_edit_weight: 0.20
  checkpoint_every: 2
  augmentation:
    enabled: true
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotate90_probability: 0.5
    brightness: 0.08
    contrast: 0.10
    gaussian_noise: 0.01
  early_stopping:
    patience: 12
    min_delta: 0.0001
  scheduler:
    factor: 0.5
    patience: 4
    threshold: 0.0001
    min_lr: 0.000001

monitoring:
  tensorboard: true
  progress_bar: true
  visualize_every: 1
  visualization_samples: 8
  pause_poll_seconds: 10

loss:
  segmentation: 1.0
  segmentation_bce: 1.0
  segmentation_dice: 1.0
  segmentation_focal: 0.25
  focal_gamma: 2.0
  focal_alpha: 0.75
  edit: 0.5
  edit_class_weights: auto
  edit_class_weight_power: 0.25
  edit_label_smoothing: 0.02
  presence: 1.0
  change: 0.5
  geometry: 0.5
  geometry_beta: 0.1
  false_edit: 0.75
  missed_edit: 0.35
  confidence: 0.2


seed: 20260710

data:
  samples: ../../data/processed/smoke/selector_samples.jsonl

model:
  hidden_dim: 32
  dropout: 0.0

training:
  device: auto
  epochs: 2
  patience: 2
  batch_size: 16
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0
  regret_loss_weight: 0.25
  listwise_loss_weight: 0.50
  utility_temperature: 0.25
  stop_loss_weight: 0.25
  grad_clip: 1.0

ablation:
  name: smoke_full
  condition_on_hypothesis: true
  drop_hypothesis_groups: []
  drop_evidence_groups: []
  drop_state_groups: []
  false_edit_penalty: true
  allow_stop: true

output_dir: ../../outputs/smoke/selector

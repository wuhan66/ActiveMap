name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and synthetic smoke workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create the geospatial environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: activemap
          auto-activate-base: false
          channel-priority: strict
          environment-file: environment.yml
          python-version: "3.10"

      - name: Install CPU-only ML dependencies and the package
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[ml,dev]"

      - name: Run release verification tests
        shell: bash -l {0}
        run: python -m pytest -q

      - name: Run the synthetic end-to-end smoke workflow
        shell: bash -l {0}
        run: bash scripts/run_smoke.sh
